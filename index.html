/* v1.37 预配置版（2026-11-27 生成）：内置云同步配置（Supabase 项目地址 + Publishable 密钥）。

   v1.36 修复：在旧版（无内置云配置）网址上打开过、本机已留下记录/设置的设备，
   换到本预配置版时内置云配置不再被"本机已有记录"挡住。
   v1.37 修复：增量同步水位按拉取上下文（电工=录入人/主管=账号）记账，身份切换后
   不再因旧水位漏掉窗口外的历史记录（修复"登主管视图看不到记录"）。 */

/* v1.34 部署自适应：真实网址下把清单启动地址改为当前页面绝对地址——"添加到主屏幕"才会指向本文件而不是目录
   （Supabase Storage 这类没有目录索引的托管，start_url 指向目录会打不开；本段在 head 内先于主脚本执行，
   生成电工版/分发版时 APP_SOURCE 捕获到的即是已修正的清单） */
(function(){try{
  var p=(location.protocol||'').toLowerCase();
  if(p!=='http:'&&p!=='https:')return;
  var l=document.querySelector('link[rel="manifest"]');
  if(!l)return;
  var href=l.getAttribute('href')||'';
  if(href.indexOf('data:application/manifest+json;base64,')!==0)return;
  var m=JSON.parse(decodeURIComponent(escape(atob(href.slice(href.indexOf(',')+1)))));
  if(!m||!m.name)return;
  m.start_url=location.href.split('#')[0].split('?')[0];
  l.setAttribute('href','data:application/manifest+json;base64,'+btoa(unescape(encodeURIComponent(JSON.stringify(m)))));
}catch(e){}})();

<script>
/* 分发版快照：在 DOM 被渲染修改前捕获原始文档，"导出分发版"时使用 */
const APP_SOURCE=document.documentElement.outerHTML;
/* ================= 基础工具 ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayD=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};
const parseD=s=>{if(!s)return null;const p=String(s).split('-');if(p.length!==3)return null;const d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d.getTime())?null:d;};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addMonths=(d,m)=>{const t=new Date(d.getFullYear(),d.getMonth()+m,1);const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d.getDate(),dim));return t;};
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
function monthsBetween(d1,d2){let m=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth());const anchor=new Date(d2.getFullYear(),d2.getMonth(),d1.getDate());if(d2<anchor)m-=1;const rem=daysBetween(addMonths(d1,m),d2);if(rem>=15)m+=1;return Math.max(m,0);}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const STATUS_TXT={ok:'正常',soon:'即将到期',overdue:'已超期',unknown:'待补全'};

/* ================= 数据 ================= */
const LS_R='emw_records_v1',LS_S='emw_settings_v1',LS_P='emw_profile_v1',LS_PULLCTX='emw_pullctx';
const FARMS_V2=['顺义孵化厂','顺义一场','顺义三场','顺义四场','顺义五场','密云东场','密云西场','密云北场','松原孵化厂','松原一场','松原二场','松原三场','松原四场','松原新租场'];
const DEFAULT_SETTINGS={remindDays:7,farms:FARMS_V2.slice(),deleted:[],farmsV:2,
  cloud:{enabled:false,service:'cloudbase',envId:'',appId:'',masterKey:'',url:'',key:'',photos:true},scope:'all'};
let records=[],settings=DEFAULT_SETTINGS;
let profile={role:'',name:'',pwd:''};
const state={view:'dashboard'};
let VIEW=[];

function loadAll(){
  const hasLocal=localStorage.getItem(LS_R)!=null;
  loadSups();
  loadSops();
  try{records=JSON.parse(localStorage.getItem(LS_R))||[];}catch(e){records=[];}
  try{const s=JSON.parse(localStorage.getItem(LS_S));
    if(s){
      settings=Object.assign({},DEFAULT_SETTINGS,s,{cloud:Object.assign({},DEFAULT_SETTINGS.cloud,s.cloud||{})});
      /* 旧版兼容：此前只有 Supabase 一种云服务，无 service 字段 */
      if(s.cloud&&!s.cloud.service&&(s.cloud.url||s.cloud.key))settings.cloud.service='supabase';
    }
  }catch(e){}
  if(!settings.cloud)settings.cloud=Object.assign({},DEFAULT_SETTINGS.cloud);
  if(!settings.farmsV||settings.farmsV<2){settings.farms=FARMS_V2.slice();settings.farmsV=2;}
  if(!Array.isArray(settings.deleted))settings.deleted=[];
  try{const p=JSON.parse(localStorage.getItem(LS_P));if(p&&p.role)profile=Object.assign({role:'',name:'',pwd:''},p);}catch(e){}
  /* 旧版升级：v1.23 起主管改为分级账号制；旧会话没有场区权限字段 → 强制重新登录，防止越权可见 */
  if(profile.role==='supervisor'&&!('supFarms' in profile)){profile.role='';profile.name='';delete profile.supId;persist();}
  /* 分发版种子数据：仅当本机从未录入过数据时自动载入。
     电工专用版（workerPkg）例外：云配置与场区/提醒设置始终以主管打包时为准并覆盖本机旧值，
     防止电工手机上残留旧版文件的数据或旧云地址，导致新包配置不生效（记录仍只在本机无数据时载入）。
     v1.36：云配置的套用与"本机有没有记录"解耦——本机没有自己的云配置（未启用或未填地址）时就套用
     内置配置。修复的场景：用户先在旧版（无内置云配置）的同一个网址上打开过，本机已留下记录/设置，
     再换到预配置版时种子被 !hasLocal 条件挡住，表现为"没有云链接、拉不到主管账号、数据不同步" */
  if(window.__EMW_SEED__){
    try{
      const seed=window.__EMW_SEED__;
      const wp=!!seed.workerPkg;
      const fresh=!hasLocal||wp;   /* 记录与场区/提醒设置仍只对全新本机（或电工版）生效，避免覆盖老数据 */
      if(fresh&&Array.isArray(seed.records)&&seed.records.length)records=seed.records.slice();
      if(seed.settings&&fresh){
        if(seed.settings.remindDays)settings.remindDays=seed.settings.remindDays;
        if(Array.isArray(seed.settings.farms)&&seed.settings.farms.length)settings.farms=seed.settings.farms.slice();
      }
      /* 主管生成的电工专用版：云配置随包带入并覆盖本机旧配置（旧项目地址/旧密钥一并更新），电工零配置。
         v1.25：电工版的地址/密钥打包前若未规范化（如控制台地址、裸项目ID、带空格），
         这里统一纠正；纠正不了就禁用云并提示联系主管，避免电工端对着错误地址反复失败 */
      let cloudSeeded=false;
      if(seed.cloud&&seed.cloud.enabled&&(wp||!settings.cloud||!settings.cloud.enabled||!settings.cloud.url)){
        let sc=Object.assign({},seed.cloud);
        if(wp){
          if(sc.key)sc.key=String(sc.key).trim();
          if((sc.service||'')==='supabase'&&sc.url){
            try{const nr=normalizeSupabaseUrl(sc.url);sc.url=nr.url;}
            catch(e){
              sc.enabled=false;
              try{localStorage.setItem('emw_seed_bad','1');}catch(err){}
              setTimeout(()=>toast('本电工专用版内置的云地址无法识别，请联系主管重新生成最新版','err'),600);
            }
          }
        }
        /* v1.36：cloudChanged 不再限于电工版——只要本机云配置被内置配置改写，
           本机旧记录就标记为待上传（此前云未启用时登记的记录不会丢，联网后自动补传） */
        const cloudChanged=JSON.stringify(settings.cloud||{})!==JSON.stringify(Object.assign({},settings.cloud,sc));
        settings.cloud=Object.assign({},settings.cloud,sc);
        cloudSeeded=true;
        if(cloudChanged)records.forEach(r=>markPending(r.id,true));
      }
      if(seed.profile&&seed.profile.role&&!profile.role)profile=Object.assign({role:'',name:'',pwd:''},seed.profile);
      if(fresh||cloudSeeded)persist();
      if(wp&&settings.cloud.enabled&&profile.role==='worker')toast('云同步已就绪（'+cloudSvcName()+'）：登记后将自动上报主管');
      else if(cloudSeeded&&!wp)toast('云同步已就绪（'+cloudSvcName()+'）：打开后自动同步，无需任何配置','ok');
    }catch(e){}
  }
}
function persist(){localStorage.setItem(LS_R,JSON.stringify(records));localStorage.setItem(LS_S,JSON.stringify(settings));localStorage.setItem(LS_P,JSON.stringify(profile));saveSupsLocal();}

满载时冷冻水进出温度差4–4.5℃，冷却水进出水温差4–4.5℃。","img":""},{"t":"每天定时巡视并记录运行数据：高低压、工作状态、排气温度、冷冻水/冷却水进出水温度、水泵进出口压力、流量、环境温度。","img":""},{"t":"保护性停机时查阅报警记录并记录；报警复位谨慎处理，不得随意复位。","img":""},{"t":"停机：开关置停机位自动停机→停地源侧水泵→保持主电源不断（维持油加热器）→长期停机放掉水管及管热器内存水防冻。","img":""},{"t":"换季切换：夏→冬9月最后一周（白天最高气温低于25℃持续5天且夜间低于15℃持续5天）；冬→夏4月第二周（高于25℃持续3天且夜间高于15℃持续3天）。","img":""},{"t":"供冷暖时间：11月15日供暖（提前1–2周开阀试运行）、3月15日停暖；6月15日供冷（室外高于30℃持续3天或室内高于26℃持续3天可提前）、9月15日停供冷。","img":""},{"t":"出水温度阶梯控温：夏季8–12℃、冬季46–52℃；孵化器出雏器工艺冷水12–17℃。","img":""},{"t":"工艺冷水故障（超12–17℃）：立即报告上级及当班负责人→查明原因排除→硬件故障关故障泵启用备用泵→记录并通知厂家维修。","img":""},{"t":"系统停电：恢复正常需30分钟机组才可正常启动；立即报告并启动应急措施，详细记录。","img":""}]},{"id":"gs_maint","type":"sop","title":"地源热泵分级保养","meta":"日/周/月/半年/年/2年/5年 · 运行人员+设备员","steps":[{"t":"【日】巡视机组运行并记录数据；巡视控制电脑报警；查管道跑冒滴漏。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAEmAiUDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QAUxAAAQMCBAMFAwcGCQoFBQEAAQACAwQRBRIhMQYTQSJRYXGRB4GhFCMyQrHB0RUzUnKS8BYkQ2KCorLh8SU0NVNzg5OzwtIXJkRjowg3ZITT8v/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAlEQEBAAICAgMAAgMBAQAAAAAAAQIRAxIhMQQTQRRRIjJhBUL/2gAMAwEAAhEDEQA/APcUIQgEIQgEIQgEIQgEIQgEhRdJmHeEKVCbnAF7i3mmmaMbvaP6QV0zuHoUJqoG7zxjzeFG6vpBvVQf8QJo7xZNkKk7FaJv/qqc/wC9ao3Y5h7dPlMX/Eb+KdbUueP60UX2WQeIcPH8sD5Ob+KifxNQAgAvPkW/ir0qfbh/bcJ1S3C593FFGPqSn0/FRu4towPzU3qPxTpUvLg6O46JQb7rmP4WU5+jBIf6QTv4VRW/zd/7YT6s0+/j/t0l0l+5c5/CmMjswC/jKPwSt4laf5OMf7xanDml+Tg6K5S3tqVz38IQfqx+590fl8dzT7/71fozT+Tg6HTTxRey5h/EhB7MZI8P8Uw8TO/1Mnqr9GaX5ODqs3ei65I8TE7wS28CnN4jv/Iz+qfRkT5WDrOiCQuU/hDfVsM1/wBZRPx2YggRya/+4fwVnBkl+Tg64uCA5p6rjTij3jWN2v8AP/uUL62Unst9XFX+PWf5cduZGDd7fVNdUQtGsrB/SC4Y1Erjq30cU3M9wOax8LJ9B/LjqcQ4hoKB9qioiuW3AD23PqVz7vaJSNJbFQzO7iXDVclxux8WIUzXAA8i+gt9Yrmq2qbTRZ3NJ8L2Cl4pPZOa309JqfadFALnDJHDW9pNlBD7WKKSRgkw2drHWu4SN0C87op4a2Bz9GEfUdbW4VPFuVHEyzGC5I0sE64tTkyfRlDX let sops=[];
function loadSops(){
  try{const v=JSON.parse(localStorage.getItem(LS_SOPS)||'null');sops=Array.isArray(v)?v:[];}catch(e){sops=[];}
  if(!sops.length){   /* 首次使用：预置内置规范包（孵化厂 10 条），其余分组空 */
    sops=JSON.parse(JSON.stringify(SOP_BUILTIN));
    saveSopsLocal();
  }
}
function saveSopsLocal(){try{localStorage.setItem(LS_SOPS,JSON.stringify(sops));}catch(e){if((sops||[]).length)toast('本机存储空间不足，规范内容未能存入本机缓存（请清理手机存储或删除较大的步骤图）','err');}}
function lastSopsPullMs(){try{return Number(localStorage.getItem(LS_SOPSPULL)||0)||0;}catch(e){return 0;}}
function setLastSopsPull(){try{localStorage.setItem(LS_SOPSPULL,String(Date.now()));}catch(e){}}
function sopsSizeKb(){try{return Math.round(JSON.stringify(sops).length/1024);}catch(e){return 0;}}
/* 任意 sops 结构的 JSON 体积（KB） */
function sopsJsonKb(list){try{return Math.round(JSON.stringify(list||[]).length/1024);}catch(e){return 0;}}
/* 体积明细：所有条目按占用空间降序（含所属分组、图片数），供超限排查与清理 */
function sopsBigItems(list,topN){
  const out=[];
  (list||sops||[]).forEach(g=>(g.items||[]).forEach(it=>{
    const imgs=(it.steps||[]).filter(s=>s.img);
    out.push({gid:g.id,gname:g.name||'',id:it.id,title:it.title||'（未命名）',type:it.type||'sop',
      imgs:imgs.length,kb:Math.round(JSON.stringify(it).length/1024)});
  }));
  out.sort((a,b)=>b.kb-a.kb);
  return topN?out.slice(0,topN):out;
}
function sopsCount(){return (sops||[]).reduce((n,g)=>n+((g.items||[]).length),0);}
/* 保存（管理员编辑后调用）：本机缓存 + 云端特殊行；quiet=true 不弹提示 */
async function saveSops(list,quiet){
  sops=Array.isArray(list)?list:[];saveSopsLocal();
  if(cloudEnabled()){
    try{await cloudUpsert(SOPS_ROW_ID,{id:SOPS_ROW_ID,groups:sops,_sops:true});}
    catch(e){if(!quiet)toast('规范内容已存本机，但云端更新失败（'+e.message+'），请稍后重试','err');}
  }else if(!quiet){
    toast('云同步未启用：内容只保存在本机，其他设备看不到','err');
  }
}
/* 应用云端下发的分组：有变化才写盘；正在"我的"页时顺手重绘 */
function applySops(groups){
  if(!Array.isArray(groups))return false;
  if(JSON.stringify(sops)===JSON.stringify(groups))return false;
  sops=groups;saveSopsLocal();
  if(typeof state!=='undefined'&&state.view==='settings')render();
  return true;
}
/* 单独拉取规范行：电工的合并拉取带录入人过滤拿不到特殊行，必须单独按 id 拉；
   30 秒内拉过则跳过；云端没有这一行（管理员还没保存过）时保留本机内容不动 */
async function pullSopsInto(force){
  if(!cloudEnabled())return -1;
  if(!force&&Date.now()-lastSopsPullMs()<30*1000)return 0;
  try{
    const rows=await cloudPullRows({idEq:SOPS_ROW_ID,limitPages:1});
    setLastSopsPull();
    for(const row of (rows||[])){
      const d=row.data||{};
      if(d._deleted){applySops([]);return 0;}
      if(d._sops&&Array.isArray(d.groups)){applySops(d.groups);return 0;}
    }
    return 0;
  }catch(e){return -1;}
}
/* ===== 主管账号与分级权限（云端为权威源） =====
   v1.23 起取消"全团队统一主管密码"，改为多账号分级权限：
   每个主管账号 = {id, name, pwd(hash), farms}；farms=null 表示总主管（全部场区），
   数组表示只能查看/登记这些场区（如顺义主管 → 顺义一/三/四/五场）。
   账号列表存云端 emw_records 特殊行 __sup_accts__，本机 emw_sups_v1 仅作缓存；
   由管理员在管理后台统一创建 / 编辑 / 删除，保存后全团队立即生效。
   兼容：没有任何账号但存在旧统一密码时，自动把它迁移为"总主管"账号（原密码仍可登录）。 */

const SUPS_ROW_ID='__sup_accts__';

function hashPwd(p){let h=5381;for(let i=0;i<p.length;i++)h=(((h<<5)+h+p.charCodeAt(i))>>>0);return 'h'+(h>>>0).toString(16);}
function isPwdHash(v){return /^h[0-9a-f]{1,8}$/.test(v||'');}

const IMG_MAX=3, IMG_SIDE=760, IMG_QUALITY=0.55;
function compressImageFile(file,maxSide,quality){
  return new Promise((resolve,reject)=>{
    if(!file.type||file.type.indexOf('image/')!==0){reject(new Error('请选择图片文件'));return;}
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error('图片读取失败'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('图片解析失败，请换一张'));
      img.onload=()=>{
        let w=img.width||0,h=img.height||0;
        if(!w||!h){reject(new Error('图片尺寸异常'));return;}
        const sc=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
        try{
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          const out=c.toDataURL('image/jpeg',quality);
          if(out.length>420*1024)reject(new Error('图片过大（压缩后仍超过 400KB），请裁剪后再试'));
          else resolve(out);
        }catch(e){reject(new Error('图片处理失败：'+e.message));}
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function updCostSum(){
  const el=$('f_costsum');if(!el)return;
  const p=parseFloat($('f_parts').value)||0,l=parseFloat($('f_labor').value)||0;
  el.textContent=money(p+l);

function autoLife(){
  const d=parseD($('f_date').value),l=parseD($('f_last').value),inp=$('f_life');
  if(d&&l&&l<=d){const m=monthsBetween(l,d);if(m>=1){inp.value=m;formState.lifeAuto=true;}else formState.lifeAuto=false;}
  else formState.lifeAuto=false;
  updLifeTag();updPreview();
}
function updLifeTag(){const t=$('f_lifetag');if(t)t.textContent=formState.lifeAuto?'自动计算':'手动输入';}
function updPreview(){
  const p=$('f_preview');if(!p)return;
  const d=parseD($('f_date').value),life=parseFloat($('f_life').value);
  if(!d||!life||life<1){p.innerHTML='';return;}
  const nd=addMonths(d,Math.round(life)),left=daysBetween(todayD(),nd),remind=addDays(nd,-settings.remindDays);
  const leftTxt=left<0?('已超期 '+(-left)+' 天'):(left===0?'今天到期':('还剩 '+left+' 天'));
  p.innerHTML='下次预计更换 / 维修：<b>'+fmt(nd)+'</b>（'+leftTxt+'）<br>提醒日期：<b>'+fmt(remind)+'</b>（提前 '+settings.remindDays+' 天，可在"我的"中调整）';
}
function saveRecord(){
  const errs=[];
  const farm=$('f_farm').value.trim(),device=$('f_device').value.trim(),part=$('f_part').value.trim();
  const date=$('f_date').value,last=$('f_last').value,life=parseFloat($('f_life').value);
  if(!farm)errs.push('请填写场区/位置');
  if(farm&&isSup()&&!farmAllowed(farm))errs.push('无权登记该场区（您的授权场区：'+farmScopeText()+'）');
  if(!device)errs.push('请填写设备名称');
  if(!part)errs.push('请填写配件名称');
  if(!date)errs.push('请选择本次维修日期');
  if(last&&parseD(last)>parseD(date))errs.push('上次维修日期不能晚于本次维修日期');
  if(!life||life<1)errs.push('使用寿命至少 1 个月');
  const errBox=$('f_err');
  if(errs.length){errBox.textContent=errs.join('；');errBox.classList.remove('hidden');return;}
  const now=nowISO();let rec;
  const costPart=canCost()?{
    partsCost:$('f_parts').value?(parseFloat($('f_parts').value)||0):0,
    laborCost:$('f_labor').value?(parseFloat($('f_labor').value)||0):0,
    outsource:!!formState.outsrc,
    outVendor:formState.outsrc?($('f_vendor').value||'').trim():'',
    cause:formState.cause||'',
    prodRel:formState.prodRel===''?undefined:formState.prodRel
  }:{};
  if(formState.editingId){
    rec=records.find(r=>r.id===formState.editingId);
    if(!rec){closeModal();return;}
    Object.assign(rec,{farm,device,part,date,lastDate:last,lifespanMonths:Math.round(life),lifespanAuto:!!formState.lifeAuto,content:$('f_content').value.trim(),worker:$('f_worker').value.trim(),note:$('f_note').value.trim(),images:formState.images.slice(),updatedAt:now},costPart);
  }else{
    rec={id:uid(),farm,device,part,date,lastDate:last,lifespanMonths:Math.round(life),lifespanAuto:!!formState.lifeAuto,content:$('f_content').value.trim(),worker:$('f_worker').value.trim(),note:$('f_note').value.trim(),images:formState.images.slice(),createdAt:now,updatedAt:now};
    Object.assign(rec,costPart);
    records.push(rec);
  }
  persist();closeModal();render();checkDue();toast('已保存');cloudPush(rec);
}

function showHistory(i){
  const key=VIEW[i].key;
  const hist=activeRecords().filter(r=>partKey(r)===key).sort((a,b)=>b.date.localeCompare(a.date));
  const lives=hist.map(r=>r.lifespanMonths).filter(n=>n>0);
  const avg=lives.length?Math.round(lives.reduce((a,b)=>a+b,0)/lives.length*10)/10:0;
  const first=hist[hist.length-1]||{date:'—'};
  let html='<div class="modal"><div class="modal-title">维修历史<span class="modal-x" onclick="closeModal()">×</span></div><div class="modal-body">'+
   '<div class="hist-sum">维修 <b>'+hist.length+'</b> 次 · 平均寿命 <b>'+(avg||'—')+'</b> 个月 · 首次 '+esc(first.date)+' · 最近 '+esc(hist[0].date)+'</div>';
  hist.forEach(r=>{
    html+='<div class="hist-item"><div class="hist-date">'+esc(r.date)+(r.lastDate?' <span class="sub">（上次 '+esc(r.lastDate)+'）</span>':'')+'</div>'+
     '<div class="hist-meta">寿命 '+r.lifespanMonths+' 个月'+(r.lifespanAuto?' · 自动计算':' · 手动填写')+(r.content?' · '+esc(r.content):'')+(r.worker?' · '+esc(r.worker):'')+(r.images&&r.images.length?' · '+r.images.length+' 张照片':'')+'</div>'+
     (r.note?'<div class="hist-note">'+esc(r.note)+'</div>':'')+
     (r.images&&r.images.length?renderImgThumbs(r.images,false):'')+
     '</div>';
  });
  html+='</div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">关闭</button></div></div>';
  openModal(html);
  /* 为缩略图绑定大图查看 */
  const items=document.querySelectorAll('.hist-item');
  hist.forEach((r,ri)=>{
    (r.images||[]).forEach((src,si)=>{
      const th=items[ri]&&items[ri].querySelectorAll('.img-thumb')[si];
      if(th)th.onclick=()=>showImages(r.images,si);
    });
  });
}
async function delRecord(id){
  if(!(isSup()||isAdmin())){toast('只有主管和管理员可以删除记录');return;}
  const r=records.find(x=>x.id===id);if(!r)return;
  const ok=await confirmDlg('删除记录','确定删除「'+r.part+'」'+r.date+' 的维修记录吗？删除后不可恢复。','删除');
  if(!ok)return;
  records=records.filter(x=>x.id!==id);
  settings.deleted=settings.deleted||[];settings.deleted.push(id);
  persist();render();toast('已删除');cloudDel(id);
}

     旧写法每敲一个字就整页重绘，输入框被销毁重建，手机中文输入法（拼音/手写候选组词）

  const workerOpts=['<option value="">全部电工</option>'].concat(workers.map(w=>'<option value="'+esc(w)+'"'+(listWorker===w?' selected':'')+'>'+esc(w)+'</option>'));

  /* 搜索只刷新列表区：输入框不重建，中文输入法组词不被打断；光标/焦点天然保留，无需再 focus() */
  $('lq').addEventListener('input',e=>{listQuery=e.target.value;renderListItems();});

/* ===== 统计页筛选状态（纯本机内存，不落盘、不同步） ===== */
let stFarm='',stDevice='',stPart='',stWorker='';
let stPartSort='avg',stPartDir=-1,stDevSort='avg',stDevDir=-1;
function stOpts(){
  const rows=allEnriched();
  const farms=[...new Set([...allowedFarmList(),...rows.map(r=>r.farm).filter(Boolean)])];
  const frows=stFarm?rows.filter(r=>r.farm===stFarm):rows;
  const devices=[...new Set(frows.map(r=>r.device).filter(Boolean))].sort();
  const drows=stDevice?frows.filter(r=>r.device===stDevice):frows;
  const parts=[...new Set(drows.map(r=>r.part).filter(Boolean))].sort();
  const workers=[...new Set(rows.map(r=>r.worker).filter(Boolean))].sort();
  return {farms,devices,parts,workers};
}
function stSetFilter(k,v){
  if(k==='farm'){stFarm=v;stDevice='';stPart='';}
  else if(k==='device'){stDevice=v;stPart='';}
  else if(k==='part'){stPart=v;
    if(v){ /* 选具体配件时，场区/设备收敛到该配件实际出现的范围 */
      const rs=allEnriched().filter(r=>r.part===v);
      stFarm=stFarm&&rs.some(r=>r.farm===stFarm)?stFarm:'';
      stDevice=stDevice&&rs.some(r=>r.device===stDevice)?stDevice:'';
    }
  }
  else if(k==='worker')stWorker=v;
  renderStats();
}
function stSort(which,field){
  if(which==='part'){if(stPartSort===field)stPartDir*=-1;else{stPartSort=field;stPartDir=-1;}}
  else{if(stDevSort===field)stDevDir*=-1;else{stDevSort=field;stDevDir=-1;}}
  renderStats();
}
const stArrow=(cur,sort,dir)=>cur===sort?'<span class="arr">'+(dir<0?'↓':'↑')+'</span>':'';
/* 聚合：按配件名称（跨设备全局） */
function statsByPart(rows){
  const m=new Map();
  rows.forEach(r=>{
    const k=r.part||'未填写';
    if(!m.has(k))m.set(k,{part:k,count:0,lives:[],min:0,max:0,last:'',farms:new Set(),devices:new Set(),perDev:new Map()});
    const it=m.get(k);
    it.count++;
    if(r.lifespanMonths>0){it.lives.push(r.lifespanMonths);it.min=Math.min(...it.lives);it.max=Math.max(...it.lives);}
    if(r.date>it.last)it.last=r.date;
    it.farms.add(r.farm||'未填写');it.devices.add((r.farm||'')+' · '+(r.device||'未填写'));
    const dk=(r.farm||'')+' · '+(r.device||'');
    if(!it.perDev.has(dk))it.perDev.set(dk,{n:0,ls:[]});
    const pd=it.perDev.get(dk);pd.n++;if(r.lifespanMonths>0)pd.ls.push(r.lifespanMonths);
  });
  return [...m.values()].map(it=>{
    const avg=it.lives.length?Math.round(it.lives.reduce((a,b)=>a+b,0)/it.lives.length*10)/10:0;
    const devTxt=[...it.perDev.entries()].map(([d,pd])=>d+'（'+pd.n+' 次'+(pd.ls.length?'，均 '+(Math.round(pd.ls.reduce((a,b)=>a+b,0)/pd.ls.length*10)/10)+' 月':'')+'）').join('；');
    return {part:it.part,count:it.count,avg,min:it.min,max:it.max,last:it.last,farmN:it.farms.size,devN:it.devices.size,devTxt};
  });
}
/* 聚合：按设备 × 配件 */
function statsByDevice(rows){
  const m=new Map();
  rows.forEach(r=>{
    const dk=(r.farm||'未填写')+'|'+(r.device||'未填写');
    const pk=r.part||'未填写';
    const k=dk+'||'+pk;
    if(!m.has(k))m.set(k,{farm:r.farm||'未填写',device:r.device||'未填写',part:pk,count:0,lives:[],last:''});
    const it=m.get(k);it.count++;if(r.lifespanMonths>0)it.lives.push(r.lifespanMonths);if(r.date>it.last)it.last=r.date;
  });
  return [...m.values()].map(it=>({farm:it.farm,device:it.device,part:it.part,count:it.count,avg:it.lives.length?Math.round(it.lives.reduce((a,b)=>a+b,0)/it.lives.length*10)/10:0,min:it.lives.length?Math.min(...it.lives):0,max:it.lives.length?Math.max(...it.lives):0,last:it.last}));
}

/* 降本指标计算：一次算全，统计页卡片与首页驾驶舱共用 */
function costMetrics(rows){
  const wc=rows.filter(hasCost);
  const total=wc.reduce((s,r)=>s+recCost(r).total,0);
  const avoidRows=wc.filter(isAvoidable);
  const avoid=avoidRows.reduce((s,r)=>s+recCost(r).total,0);
  const selfRows=wc.filter(r=>!r.outsource),outRows=wc.filter(r=>r.outsource);
  const prodRows=wc.filter(r=>r.prodRel===true),otherRows=wc.filter(r=>r.prodRel===false);
  const prodFee=prodRows.reduce((s,r)=>s+recCost(r).total,0);
  const otherFee=otherRows.reduce((s,r)=>s+recCost(r).total,0);
  const outFee=outRows.reduce((s,r)=>s+recCost(r).total,0);
  const selfParts=selfRows.reduce((s,r)=>s+recCost(r).parts,0);
  const outAvg=outRows.length?outFee/outRows.length:0;
  const saved=selfRows.length&&outAvg?selfRows.length*outAvg-selfParts:0;
  const cause={};COST_TAGS.forEach(t=>cause[t]={n:0,fee:0});
  wc.forEach(r=>{if(r.cause&&cause[r.cause]){cause[r.cause].n++;cause[r.cause].fee+=recCost(r).total;}});
  const months=[];
  for(let i=5;i>=0;i--){const d=addMonths(todayD(),-i);const ym=fmt(d).slice(0,7);const mr=wc.filter(r=>String(r.date).slice(0,7)===ym);
    months.push({label:(d.getMonth()+1)+'月',fee:mr.reduce((s,r)=>s+recCost(r).total,0),prodFee:mr.filter(r=>r.prodRel===true).reduce((s,r)=>s+recCost(r).total,0),otherFee:mr.filter(r=>r.prodRel===false).reduce((s,r)=>s+recCost(r).total,0),n:mr.length,selfN:mr.filter(r=>!r.outsource).length});}
  return {rows:rows,wc:wc,total:total,avoid:avoid,avoidN:avoidRows.length,
    prodN:prodRows.length,otherN:otherRows.length,unsetN:wc.length-prodRows.length-otherRows.length,
    prodFee:prodFee,otherFee:otherFee,unsetFee:total-prodFee-otherFee,
    prodRate:total?Math.round(prodFee/total*100):0,
    selfN:selfRows.length,outN:outRows.length,selfParts:selfParts,outAvg:outAvg,saved:saved,
    coverN:wc.length,coverRate:rows.length?Math.round(wc.length/rows.length*100):0,
    selfRateN:wc.length?Math.round(selfRows.length/wc.length*100):0,
    feeSelfRate:total?Math.round((total-outFee)/total*100):0,
    avoidRate:total?Math.round(avoid/total*100):0,
    cause:cause,months:months};
}

     '<label class="fl">您的姓名（登记维修时自动带上）</label><input id="g_name" placeholder="如：张伟">'+

function pwdInput(id,ph){

/* ================= 云同步（免费 · 在线查看团队数据） =================
   支持三家免费云服务，数据结构一致（一行一条记录：业务ID + 数据 + 更新时间）：
   ① 腾讯云开发 CloudBase（推荐：国内最快、微信扫码注册、免写后端）
   ② Bmob 后端云（手机号注册、纯 REST；免费试用 3 个月，之后 ¥30/月）
   ③ Supabase（海外、永久免费额度最大，国内访问偶尔慢几秒）           */
const CLOUD_COLL='emw_records';
const TCB_SDK='https://imgcache.qq.com/qcloud/tcb-js-sdk/1.5.3/tcb-js-sdk.min.js';
const BM_BASE='https://api.codenow.cn';
let tcbPromise=null;
function cloudSvc(){return (settings.cloud&&settings.cloud.service)||'cloudbase';}
function cloudEnabled(){
  const c=settings.cloud||{};
  if(!c.enabled)return false;
  if(c.service==='cloudbase')return !!c.envId;
  if(c.service==='bmob')return !!(c.appId&&c.masterKey);
  return !!(c.url&&c.key);
}
function cloudSvcName(){
  return {cloudbase:'腾讯云开发',bmob:'Bmob',supabase:'Supabase 海外版'}[cloudSvc()]||'云服务';
}
/* 把技术性错误翻译成用户能行动的话（按 HTTP 状态码分类） */
function cloudErrHint(e){
  const m=String((e&&e.message)||e||'');
  const st=String((e&&e.status)||(/HTTP\s+(\d+)/i.exec(m)||[])[1]||'');
  if(st==='401'||st==='403')return 'HTTP '+st+' 密钥不被接受：请确认复制的是 Publishable key（sb_publishable 开头）或旧版 anon public（eyJ 开头），不要用 secret / service_role，也不要在密钥里带空格或省略号';
  if(st==='404')return 'HTTP 404 云端找不到数据表：请到 Supabase 的 SQL Editor 把教程里的建表 SQL 重新运行一遍';
  if(st==='540')return 'HTTP 540 项目已被暂停：这是 Supabase 免费项目长期无活动的暂停码。登录 supabase.com → 项目列表找到该项目 → 点"恢复项目"，等几分钟再试（恢复后团队每天使用即不会再暂停）';
  if(st==='400')return 'HTTP 400 请求被拒绝：多为建表 SQL 最后的授权语句没执行，请到 SQL Editor 把教程 SQL 完整重跑一遍';
  if(st==='413')return 'HTTP 413 数据太大超上限：多为照片过大。系统已自动压缩重试；若仍失败，请在登记时少传照片，或联系主管在管理后台关闭"照片同步到云端"';
  if(st)return 'HTTP '+st+' 云端返回错误：可点管理后台"一键诊断"查看详情，或把诊断报告发给懂行的人';
  if(/failed to fetch|networkerror|load failed/i.test(m))return m+'（连不上服务器：先检查手机网络 / WiFi；若用 Supabase，也可能是项目长期无活动被暂停、域名失效——登录后台确认项目状态，必要时点"恢复项目"）';
  return m;
}
/* ---- 一键诊断：分层探测当前云配置，输出大白话结论 + 可复制的诊断报告 ---- */
async function cloudDiagnose(){
  const box=$('diag_box'); if(!box)return;
  box.innerHTML='<div class="cloud-st warn">诊断进行中，请稍候…</div>';
  const steps=[];

/* Supabase 项目地址清洗：很多人会把控制台网页地址（supabase.com/dashboard/...）
   当成接口地址粘进来，导致 failed to fetch。这里自动识别并纠正。 */
function normalizeSupabaseUrl(raw){
  let u=(raw||'').trim();
  if(!u)throw new Error('请先填写 Supabase 项目地址（URL）');
  const m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  if(m)return {url:'https://'+m[1]+'.supabase.co',fixed:true};
  if(/supabase\.com/i.test(u))throw new Error('地址粘错了：这是 Supabase 控制台网页地址，不是项目接口地址。正确格式为 https://你的项目ID.supabase.co（项目 ID 在 Settings → General 页，或浏览器地址栏 /dashboard/project/ 后面那串）');
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  u=u.replace(/\/+$/,'');
  /* 只填了项目 ID（形如 https://xxxx 或直接一串 ID）：自动补 .supabase.co */
  if(/^https?:\/\/[a-z0-9-]+$/.test(u)){
    const ref=u.replace(/^https?:\/\//,'');
    return {url:'https://'+ref+'.supabase.co',fixed:true};
  }
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u))throw new Error('项目地址格式不正确：应为 https://xxxx.supabase.co（只填项目 ID 也会自动补全；或到 Settings → Data API 页复制 Project URL）');
  return {url:u,fixed:false};
}
/* ---- 腾讯云开发：懒加载官方 SDK + 匿名登录 ---- */
function getTcb(){
  if(tcbPromise)return tcbPromise;
  const c=settings.cloud;
  tcbPromise=new Promise((resolve,reject)=>{
    const boot=()=>{
      try{
        if(!window.tcb)throw new Error('SDK 未就绪');
        const app=window.tcb.init({env:c.envId});
        Promise.resolve(app.auth().anonymousAuthProvider().signIn())
          .then(()=>resolve(app),()=>{
            try{if(app.auth().hasLoginState&&app.auth().hasLoginState())return resolve(app);}catch(e){}
            reject(new Error('匿名登录失败，请确认已在云开发控制台开启"匿名登录"'));
          });
      }catch(e){tcbPromise=null;reject(e);}
    };
    if(window.tcb)return boot();
    const s=document.createElement('script');
    s.src=TCB_SDK;s.onload=boot;
    s.onerror=()=>{tcbPromise=null;reject(new Error('云开发 SDK 加载失败，请检查网络后重试'));};
    document.head.appendChild(s);
  });
  return tcbPromise;
}
/* ---- 统一读写：增量同步 + 分页 + 删除墓碑 ----
   计费背景（以腾讯云开发免费体验版为例：3,000 资源点/月，1,000 点≈1 元）：
   数据库调用 200 点/万次 · 数据库容量 40 点/GB/天 · CDN 流量 210 点/GB。
   因此同步策略：① 增量——只拉取上次同步后变化的记录；② 隔离——电工只拉取
   署名为自己的记录（主管拉全部）；③ 删除写墓碑行（仅留 id 和标记），保证
   增量同步也能把删除传播到其他手机。 */
function lastSyncMs(){
  try{
    const v=localStorage.getItem('emw_lastsync')||'';
    if(!v)return 0;
    const n=parseInt(v,10);
    if(!isNaN(n)&&n>1e12)return n;          /* 新格式：epoch 毫秒 */
    const t=Date.parse(v);                   /* 旧格式：ISO 字符串 */
    return isNaN(t)?0:t;
  }catch(e){return 0;}
}
function setLastSync(){try{localStorage.setItem('emw_lastsync',String(Date.now()));}catch(e){}}
function fmtSync(v){
  if(!v)return '';
  const n=parseInt(v,10);
  const d=(!isNaN(n)&&n>1e12)?new Date(n):new Date(v);
  if(isNaN(d.getTime()))return '';
  const p=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
/* 带超时和自动重试的 fetch：海外服务器 + 手机网络下，单次抖动不再直接失败
   tries：总尝试次数（默认 3）；4xx（除 408 超时 / 429 限流）重试无意义，直接放弃 */
async function fetchRetry(url,opts,tries){
  tries=tries||3;
  let last=null;
  for(let i=0;i<tries;i++){
    const ac=(typeof AbortController!=='undefined')?new AbortController():null;
    const tm=ac?setTimeout(()=>{try{ac.abort();}catch(e){}},12000):0;
    try{
      const o=Object.assign({},opts||{});
      if(ac)o.signal=ac.signal;
      const r=await fetch(url,o);
      if(tm)clearTimeout(tm);
      if(r.ok)return r;
      if(r.status===413)return r;   /* 请求体超限：交调用方降级处理（如压缩照片后重试），重试无意义 */
      last=new Error('HTTP '+r.status);
      if(r.status>=400&&r.status<500&&r.status!==408&&r.status!==429)break;
    }catch(e){
      if(tm)clearTimeout(tm);
      last=e;
    }
    if(i<tries-1)await new Promise(res=>setTimeout(res,(i+1)*600));
  }
  throw last||new Error('网络请求失败');
}
/* 轻量连通性探测（v1.26）：HEAD + count=exact 只回状态头和 Content-Range 头里的总行数，
   响应体几乎为零——“测试连接 / 一键诊断”从拉整页含照片的记录（几 MB）变成秒回 */
async function cloudPing(){
  const c=settings.cloud;
  const t0=Date.now();
  if(c.service==='cloudbase'){
    const app=await getTcb();
    await app.database().collection(CLOUD_COLL).limit(1).get();
    return {ms:Date.now()-t0};
  }
  if(c.service==='bmob'){
    const h={'X-Bmob-Application-Id':c.appId,'X-Bmob-Master-Key':c.masterKey};
    const r=await fetch(BM_BASE+'/1/classes/'+CLOUD_COLL+'?limit=1&keys=id',{headers:h});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return {ms:Date.now()-t0};
  }
  const base=(c.url||'').replace(/\/+$/,'');
  const h={'apikey':c.key};
  if(/^eyJ/.test(c.key))h['Authorization']='Bearer '+c.key;
  const r=await fetchRetry(base+'/rest/v1/'+CLOUD_COLL+'?select=id&limit=1',{method:'HEAD',headers:Object.assign({},h,{'Prefer':'count=exact'})},2);
  const m=/(\d+)\s*$/.exec(r.headers.get('Content-Range')||'');
  return {ms:Date.now()-t0,rows:m?parseInt(m[1],10):-1};
}
async function cloudPullRows(opts){
  opts=opts||{};
  const since=opts.since||0, worker=(opts.worker||'').trim();
  const maxPages=opts.limitPages||0;
  const c=settings.cloud;
  if(c.service==='cloudbase'){
    const app=await getTcb();
    const db=app.database();
    const coll=db.collection(CLOUD_COLL);
    const cmd=db.command();
    const cond={};
    if(opts.idEq)cond.id=opts.idEq;
    if(since)cond.uts=cmd.gt(since);
    if(worker)cond['data.worker']=worker;
    const out=[];let skip=0,pages=0;
    for(;;){
      const r=await coll.where(cond).skip(skip).limit(1000).get();
      const rows=(r&&r.data)||[];
      rows.forEach(d=>out.push({id:d.id,data:d.data,uts:typeof d.uts==='number'?d.uts:(Date.parse(d.uts||'')||0)}));
      pages++;
      if(rows.length<1000||(maxPages&&pages>=maxPages)||skip>=50000)break;
      skip+=1000;
    }
    return out;
  }
  if(c.service==='bmob'){
    const cond={};
    if(opts.idEq)cond.id=opts.idEq;
    if(since)cond.uts={$gt:since};
    if(worker)cond['data.worker']=worker;
    const qs=Object.keys(cond).length?'&where='+encodeURIComponent(JSON.stringify(cond)):'';
    const h={'X-Bmob-Application-Id':c.appId,'X-Bmob-Master-Key':c.masterKey};
    const out=[];let skip=0,pages=0;
    for(;;){
      const r=await fetch(BM_BASE+'/1/classes/'+CLOUD_COLL+'?limit=200&skip='+skip+'&keys=id,data,uts'+qs,{headers:h});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      const rows=(j&&j.results)||[];
      rows.forEach(d=>out.push({id:d.id,data:d.data,uts:typeof d.uts==='number'?d.uts:(Date.parse(d.uts||'')||0)}));
      pages++;
      if(rows.length<200||(maxPages&&pages>=maxPages)||skip>=50000)break;
      skip+=200;
    }
    return out;
  }
  const base=(c.url||'').replace(/\/+$/,'');
  const h={'apikey':c.key};
  if(/^eyJ/.test(c.key))h['Authorization']='Bearer '+c.key;   /* 旧版 anon 是 JWT 才需 Bearer；新版 publishable 密钥只需 apikey 头 */
  let qs='?select=id,data,updated_at&order=id';
  if(opts.idEq)qs+='&id=eq.'+encodeURIComponent(opts.idEq);
  if(since)qs+='&updated_at=gt.'+encodeURIComponent(new Date(since).toISOString());
  if(worker)qs+='&data->>worker=eq.'+encodeURIComponent(worker);
  const out=[];let off=0,pages=0;
  for(;;){
    const r=await fetchRetry(base+'/rest/v1/'+CLOUD_COLL+qs+'&limit=500&offset='+off,{headers:h},3);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=await r.json();
    const arr=Array.isArray(rows)?rows:[];
    arr.forEach(d=>out.push({id:d.id,data:d.data,uts:Date.parse(d.updated_at||'')||0}));
    pages++;
    if(arr.length<500||(maxPages&&pages>=maxPages)||off>=50000)break;
    off+=500;
  }
  return out;
}
/* 上传前压缩照片：手机原图 base64 可达 2-4MB，可能超出云平台免费额度的单次请求体限制（HTTP 413）。
   用 canvas 等比缩到 maxW 宽、JPEG quality 质量；已是小图 / 非图片 / 环境不支持时原样返回 */
function compressDataURL(dataURL,maxW,quality){
  return new Promise(resolve=>{
    const done=v=>resolve(v);
    try{
      if(typeof dataURL!=='string'||!/^data:image\//i.test(dataURL))return done(dataURL);
      if(typeof document==='undefined'||!document.createElement||typeof Image==='undefined')return done(dataURL);
      const img=new Image();
      img.onload=()=>{
        try{
          const w=img.naturalWidth||img.width||0,h=img.naturalHeight||img.height||0;
          if(!w||!h)return done(dataURL);
          const scale=Math.min(1,maxW/w);
          if(scale>=1&&dataURL.length<700*1024)return done(dataURL);   /* 已经够小，不动 */
          const cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(w*scale));cv.height=Math.max(1,Math.round(h*scale));
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          done(cv.toDataURL('image/jpeg',quality));
        }catch(e){done(dataURL);}
      };
      img.onerror=()=>done(dataURL);
      img.src=dataURL;
    }catch(e){done(dataURL);}
  });
}
/* 上传时若遇 HTTP 413（请求体超限）：把记录内照片压缩后重试一次；仍失败则抛错 */
async function cloudUpsert(rid,data,updatedAt,_retried){
  const c=settings.cloud;
  const uts=updatedAt?(typeof updatedAt==='number'?updatedAt:(Date.parse(updatedAt)||Date.now())):Date.now();
  const wk=(data&&data.worker)||'';
  if(c.service==='cloudbase'){
    const app=await getTcb();
    const coll=app.database().collection(CLOUD_COLL);
    const ex=await coll.where({id:rid}).limit(1).get();
    if(ex.data&&ex.data.length)await coll.doc(ex.data[0]._id).update({data:data,uts:uts,worker:wk});
    else await coll.add({id:rid,data:data,uts:uts,worker:wk});
    return;
  }
  if(c.service==='bmob'){
    const h={'X-Bmob-Application-Id':c.appId,'X-Bmob-Master-Key':c.masterKey,'Content-Type':'application/json'};
    const q=await fetch(BM_BASE+'/1/classes/'+CLOUD_COLL+'?where='+encodeURIComponent(JSON.stringify({id:rid}))+'&limit=1',{headers:h});
    if(!q.ok)throw new Error('HTTP '+q.status);
    const qj=await q.json();
    if(qj.results&&qj.results.length){
      const r=await fetch(BM_BASE+'/1/classes/'+CLOUD_COLL+'/'+qj.results[0].objectId,{method:'PUT',headers:h,body:JSON.stringify({data:data,uts:uts,worker:wk})});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }else{
      const r=await fetch(BM_BASE+'/1/classes/'+CLOUD_COLL,{method:'POST',headers:h,body:JSON.stringify({id:rid,data:data,uts:uts,worker:wk})});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }
    return;
  }
  const base=(c.url||'').replace(/\/+$/,'');
  const r=await fetchRetry(base+'/rest/v1/'+CLOUD_COLL,{method:'POST',
    headers:Object.assign({'Content-Type':'application/json','apikey':c.key,'Prefer':'resolution=merge-duplicates,return=minimal'},/^eyJ/.test(c.key)?{'Authorization':'Bearer '+c.key}:{}),
    body:JSON.stringify({id:rid,data:data,updated_at:new Date(uts).toISOString()})},3);
  if(r.status===413&&!_retried&&data&&Array.isArray(data.images)&&data.images.length){
    /* 请求体超限：压缩照片后原样重试一次（云端存的也是压缩图，容量更省） */
    const imgs=[];
    for(const u of data.images)imgs.push(await compressDataURL(u,1280,0.72));
    return cloudUpsert(rid,Object.assign({},data,{images:imgs}),updatedAt,true);
  }
  if(!r.ok)throw new Error('HTTP '+r.status);
}
/* 批量上传（v1.26，仅 Supabase）：PostgREST 支持一次 POST 多行数组，
   Prefer: resolution=merge-duplicates 即按 id 逐行 upsert——N 次请求合成 1 次。
   413（请求体超限）时先把各行照片统一压缩重试；仍超限则对半拆分递归。
   返回值：null=原样成功；非 null=压缩后的行数据（调用方回写本机压缩图，后续同步更小） */
async function cloudUpsertBatch(rows){
  const c=settings.cloud;
  const base=(c.url||'').replace(/\/+$/,'');
  const hdr=Object.assign({'Content-Type':'application/json','apikey':c.key,'Prefer':'resolution=merge-duplicates,return=minimal'},/^eyJ/.test(c.key)?{'Authorization':'Bearer '+c.key}:{});
  const send=list=>fetchRetry(base+'/rest/v1/'+CLOUD_COLL,{method:'POST',headers:hdr,
    body:JSON.stringify(list.map(x=>({id:x.id,data:x.data,updated_at:new Date(x.uts).toISOString()})))},3);
  let r=await send(rows);
  if(r.status!==413){if(!r.ok)throw new Error('HTTP '+r.status);return null;}
  /* 413：整体压缩照片后重试一次 */
  const rows2=[];
  for(const x of rows){
    const d=Object.assign({},x.data);
    if(Array.isArray(d.images)&&d.images.length){
      const imgs=[];
      for(const u of d.images)imgs.push(await compressDataURL(u,1280,0.72));
      d.images=imgs;
    }
    rows2.push({id:x.id,data:d,uts:x.uts});
  }
  r=await send(rows2);
  if(r.status===413){
    if(rows2.length>1){
      const mid=Math.ceil(rows2.length/2);
      await cloudUpsertBatch(rows2.slice(0,mid));
      await cloudUpsertBatch(rows2.slice(mid));
      return rows2;
    }
    throw new Error('HTTP 413');
  }
  if(!r.ok)throw new Error('HTTP '+r.status);
  return rows2;
}
/* 删除 = 写墓碑行（仅保留 id 与标记），让其他手机的增量同步也能收到删除 */
async function cloudRemove(rid){
  await cloudUpsert(rid,{id:rid,_deleted:true},Date.now());
}
/* ---- 断网保护：上传/删除失败进入"待同步"队列，恢复后自动补传，数据永不丢失 ---- */
function pendingUploads(){try{return JSON.parse(localStorage.getItem('emw_pending')||'[]');}catch(e){return [];}}
function markPending(id,on){
  let p=pendingUploads();
  if(on){if(p.indexOf(id)<0)p.push(id);}
  else p=p.filter(x=>x!==id);
  try{localStorage.setItem('emw_pending',JSON.stringify(p));}catch(e){}
  return p.length;
}
/* ---- 增量上传状态（v1.26）：记住每条记录已成功传到云端的 updatedAt ----
   “立即同步”只传有变化的记录；从云端合并来的记录也标记为已同步，避免原样回传。
   没有这张表时 isDirty 恒为真，会自动全传一次，之后每次只传增量 */
function syncedAtMap(){try{return JSON.parse(localStorage.getItem('emw_syncedat')||'{}');}catch(e){return {};}}
function recUts(rec){const v=rec&&rec.updatedAt;if(typeof v==='number')return v;return Date.parse(v||'')||0;}
function isDirty(rec){const v=syncedAtMap()[rec.id];return !v||v<recUts(rec);}
function markSynced(id,uts){try{const m=syncedAtMap();m[id]=uts;localStorage.setItem('emw_syncedat',JSON.stringify(m));}catch(e){}}
function markSyncedBatch(list){if(!list||!list.length)return;try{const m=syncedAtMap();for(const x of list)m[x.id]=x.uts;localStorage.setItem('emw_syncedat',JSON.stringify(m));}catch(e){}}
/* 同步操作串行链：启动链 / 手动同步 / 断网补传 / 前台增量拉取 统一排队执行。
   避免多路并发交错——曾出现补传提示插进手动同步流程、两路拉取重复请求导致提示混乱 */
let syncChain=Promise.resolve();
function syncNext(fn){
  const r=syncChain.then(fn);
  syncChain=r.then(()=>{},()=>{});

async function retryPendingInner(){

    if(x.indexOf('del:')===0){
      try{await cloudRemove(x.slice(4));markPending(x,false);done++;}catch(e){fail++;}
    }else{
      const rec=records.find(r=>r.id===x);
      if(rec){const okPush=await cloudPush(rec,true);if(okPush!==false)done++;else fail++;}
      else markPending(x,false);
    }
  }

async function cloudPush(rec,quiet){
  if(!cloudEnabled()){markPending(rec.id,true);return;}
  try{
    let out=rec;
    const ua=rec.updatedAt||nowISO();
    if(settings.cloud&&settings.cloud.photos===false&&rec.images&&rec.images.length)out=Object.assign({},rec,{images:[]});
    await cloudUpsert(rec.id,out,ua);
    markPending(rec.id,false);noteSyncOk();markSynced(rec.id,typeof ua==='number'?ua:(Date.parse(ua)||Date.now()));return true;
  }catch(e){
    markPending(rec.id,true);noteSyncFail(e);
    if(!quiet)toast('上传失败，已存本机（不会丢失）：'+pushErrText(e),'err');
    return false;
  }
}

let lastPullStat={pulled:0,merged:0,at:0};   /* v1.31：最近一次拉取的云端行数统计 */
async function cloudPullMerge(full,silent){
  if(!cloudEnabled())return -1;
  if(!profile.role)return 0;   /* 身份未设置时不拉取，避免把全员数据下载到新手机 */
  if(profile.role==='worker'&&!(profile.name||'').trim())return 0;   /* 电工未填姓名时不拉取，理由同上 */
  try{
    const last=lastSyncMs();
    const isW=profile.role==='worker';
    /* v1.37：增量水位按"拉取上下文"记账（电工=录入人，主管=账号）。身份/账号切换后旧水位会把
       窗口外的历史记录永久漏掉——典型现象：先以电工身份打开过（拉取已记账），再登主管视图时
       增量只取最近 5 分钟，几天前的记录永远下不来，主管"看不到记录"。上下文变化时强制全量
       拉取；拉取成功后（setLastSync 处）才更新上下文标记，失败不写，下次仍会全量重试 */
    const pullCtx=isW?('w:'+(profile.name||'').trim()):(isSup()?('s:'+(profile.supId||'')):'x');
    let prevCtx='';try{prevCtx=localStorage.getItem(LS_PULLCTX)||'';}catch(e){}
    const ctxChanged=prevCtx!==pullCtx;
    const since=(!full&&last&&!ctxChanged)?Math.max(0,last-5*60*1000):0;   /* 留 5 分钟重叠，防时钟偏差 */
    const rows=await cloudPullRows({since:since,worker:isW?(profile.name||'').trim():''});
    if(!rows)return -1;
    const del=settings.deleted||[];
    let n=0,dn=0,tn=0,pulled=0;
    const syncedIds=[];   /* 从云端合并来的行：标记已同步，避免下次再原样回传（增量上传用） */
    rows.forEach(row=>{
      const d=row.data||{};
      if(d._boss){                       /* 统一密码行：仅更新本机密码缓存（须先于 id 检查） */
        if(d.pwd&&profile.pwd!==d.pwd){profile.pwd=d.pwd;persist();}
        return;
      }
      if(d._admin){                      /* 管理员凭据行：仅更新本机缓存（改密后全团队自动生效） */
        if(d.acct&&d.pwd&&(profile.adminAcct!==d.acct||profile.adminPwd!==d.pwd)){profile.adminAcct=d.acct;profile.adminPwd=d.pwd;persist();}
        return;
      }
      if(d._sups){                       /* 主管账号行：刷新本机缓存并同步当前登录账号的场区权限 */
        if(Array.isArray(d.accounts))applySupList(d.accounts);
        return;
      }
      if(d._sops){                       /* 规范操作行：刷新本机缓存（管理员/主管路径；电工靠 pullSopsInto 单独拉） */
        if(Array.isArray(d.groups))applySops(d.groups);
        setLastSopsPull();
        return;
      }
      if(!d.id)return;
      pulled++;   /* v1.31：云端实际存在的记录行（含墓碑），用于"云端到底有没有数据"判断 */
      if(d._deleted){                                        /* 墓碑：本地同步删除 */
        if(del.includes(d.id))return;
        settings.deleted.push(d.id);tn++;
        const i=records.findIndex(x=>x.id===d.id);
        if(i>=0){records.splice(i,1);dn++;}
        return;
      }
      if(!d.date||del.includes(d.id))return;
      const local=records.find(x=>x.id===d.id);
      const uts=row.uts||0;
      if(!local){records.push(d);n++;syncedIds.push({id:d.id,uts:uts});}
      else if(uts>(Date.parse(local.updatedAt||'')||0)){
        /* 云端记录无照片而本机有（对方关闭了照片同步）时，保留本机照片 */
        const keep=(!d.images||!d.images.length)&&local.images&&local.images.length?local.images:d.images;
        Object.assign(local,d,{images:keep||[]});
        n++;syncedIds.push({id:d.id,uts:uts});
      }
    });
    if(syncedIds.length)markSyncedBatch(syncedIds);
    if(n||dn||tn){persist();render();}
    lastPullStat={pulled:pulled,merged:n,at:Date.now()};
    setLastSync();
    if(ctxChanged){try{localStorage.setItem(LS_PULLCTX,pullCtx);}catch(e){}}
    if(n>0&&!silent)toast('已从云端合并 '+n+' 条新记录');
    return n;
  }catch(e){if(!silent)toast('云端拉取失败：'+cloudErrHint(e),'err');return -1;}
}
async function cloudSyncAllInner(full){
  const n=await cloudPullMerge(full,true);   /* silent：由本函数末尾统一提示，避免弹两次 */
  /* v1.26 增量 + 批量上传：
     ① 只上传本机发生过变化的记录（emw_syncedat 记住每条已传到的 updatedAt，无改动的直接跳过）；
     ② Supabase 用 PostgREST 原生批量 upsert，一次请求传完全部变更（几百条从几分钟降到几秒）；
     ③ 批量失败（网络抖动/单条过大）自动回退逐条上传，保证不丢数据 */
  const sm=syncedAtMap();
  const dirty=records.filter(rec=>{const v=sm[rec.id];return !v||v<recUts(rec);});
  let pushed=0,failed=0;
  if(dirty.length&&cloudSvc()==='supabase'){
    try{
      const noPhoto=settings.cloud&&settings.cloud.photos===false;
      const rows=dirty.map(rec=>({id:rec.id,uts:recUts(rec),
        data:(noPhoto&&rec.images&&rec.images.length)?Object.assign({},rec,{images:[]}):rec}));
      const compressed=await cloudUpsertBatch(rows);   /* 非 null = 遇 413 压缩过照片，需把压缩图回写本机 */
      if(compressed){
        const map={};compressed.forEach(x=>{map[x.id]=x.data;});
        let changed=false;
        dirty.forEach(rec=>{const d=map[rec.id];if(d&&Array.isArray(d.images)&&d.images.length){rec.images=d.images;changed=true;}});
        if(changed)persist();
      }
      pushed=dirty.length;
      markSyncedBatch(dirty.map(rec=>({id:rec.id,uts:recUts(rec)})));
      /* 批量清除这些记录的待上传标记（一次写入，避免几百条逐条写 localStorage） */
      try{
        const ids={};dirty.forEach(r=>{ids[r.id]=1;});
        const rest=pendingUploads().filter(x=>!(x.indexOf('del:')===0?ids[x.slice(4)]:ids[x]));
        if(rest.length!==pendingUploads().length)localStorage.setItem('emw_pending',JSON.stringify(rest));
      }catch(e){}
      noteSyncOk();
    }catch(e){
      pushed=0;
      for(const rec of dirty){const okPush=await cloudPush(rec,true);if(okPush!==false)pushed++;else failed++;}
    }
  }else if(dirty.length){
    for(const rec of dirty){const okPush=await cloudPush(rec,true);if(okPush!==false)pushed++;else failed++;}
  }
  for(const x of pendingUploads()){ if(x.indexOf('del:')===0){ try{await cloudRemove(x.slice(4));markPending(x,false);}catch(e){} } }
  render();
  const pend=pendingUploads().length;
  const skipped=records.length-dirty.length;
  if(n<0)toast('云端连接失败：所有数据已存本机不会丢失，恢复后自动补传','err');
  else if(failed>0)toast((full?'全量刷新完成':'同步完成')+'：合并 '+n+' 条，上传成功 '+pushed+' 条、<b>失败 '+failed+' 条</b>（已存本机，有网络时自动补传）','err');
  else if(pushed>0)toast((full?'全量刷新完成':'同步完成')+'：合并 '+n+' 条，上传 '+pushed+' 条'+(skipped?'（'+skipped+' 条已同步未重复传）':'')+(pend?'，'+pend+' 项待补传':''));
  else if(!records.length&&lastPullStat.pulled===0)toast('同步完成，但云端没有可拉取的记录：请让管理员确认云端已有数据，并检查本账号的授权场区','err');
  else toast('已是最新：合并 '+n+' 条，本地无新变更'+(skipped?'（'+skipped+' 条已同步未重复传）':''));
}
async function cloudSyncAll(full){
  if(!cloudEnabled()){toast('请先启用并保存云同步配置','err');return;}
  toast(full?'正在全量刷新…':'正在同步…');
  /* 串入同步链：与启动链/补传排队，避免并发交错导致提示混乱 */
  return syncNext(()=>cloudSyncAllInner(full));
}

function workerSyncCard(){
  const pend=pendingUploads().length;
  const failMsg=(()=>{try{return localStorage.getItem('emw_syncfail_msg')||'';}catch(e){return '';}})();
  let st;
  if(!cloudEnabled()){
    st='<div class="cloud-st off">云同步未启用。<b>不影响使用</b>：登记、提醒、统计都在本机完成，数据可随时导出 CSV / JSON 备份；云恢复后打开 App 会自动补传，不会丢失。</div>';
  }else{
    const last=lastSyncMs();
    st='<div class="cloud-st ok">云同步已启用（'+cloudSvcName()+' · 由主管统一管理）'+(last?' · 上次同步 '+fmtSync(last):'')+'。每次登记后自动上报，无需任何操作。</div>';
  }
  return '<div class="card"><div class="card-title">云端同步<span class="sub">由主管统一管理 · 无需操作</span></div>'+st+
   (pend?'<div class="cloud-st off" style="margin-top:6px">⚠️ 有 <b>'+pend+'</b> 条登记尚未上传'+(failMsg?'（最近错误：'+esc(failMsg)+'）':'（网络原因）')+'。数据已安全保存在本机，有网络时打开 App 会自动补传，也可点<button class="btn small" style="margin-left:6px" onclick="retryPending()">立即补传</button>。</div>':'')+
   '<p class="tip">云同步配置由管理员在管理后台统一设置（最高权限），此处无需也无法修改。如显示未启用，或长时间无法上传，请联系设备主管或管理员重新生成最新版。</p></div>';
}

/* 添加 / 编辑主管账号（场区多选 + 总主管开关） */
function openSupAcctForm(id){
  const a=id?supAccts.find(x=>x.id===id):null;
  if(id&&!a)return;
  const isAll=!a||a.farms===null;
  const farms=a&&a.farms?a.farms:[];
  openModal('<div class="modal"><div class="modal-title">'+(a?'编辑主管账号':'添加主管账号')+'<span class="modal-x" onclick="closeModal()">×</span></div><div class="modal-body">'+
   '<label class="fl">账号名称（登录时显示选择，如：顺义主管）</label><input id="sp_name" autocomplete="off" value="'+(a?esc(a.name):'')+'" placeholder="如：顺义主管">'+
   '<label class="ck"><input type="checkbox" id="sp_all"'+(isAll?' checked':'')+'> 总主管：可查看全部场区</label>'+
   '<div id="sp_farmwrap" class="'+(isAll?'hidden':'')+'"><label class="fl">可查看的场区（至少选 1 个）</label>'+
   settings.farms.map(f=>'<label class="ck"><input type="checkbox" class="sp_farm" value="'+esc(f)+'"'+(farms.indexOf(f)>=0?' checked':'')+'> '+esc(f)+'</label>').join('')+'</div>'+
   '<label class="fl">'+(a?'新密码（4-6 位数字；不修改请留空）':'密码（4-6 位数字）')+'</label>'+pwdInput('sp_pwd','登录密码')+
   '<label class="fl">再次输入密码</label>'+pwdInput('sp_pwd2','再输一次')+
   '<p class="pwd-tip">密码以不可逆加密形式保存。分级主管只能查看被授权场区的数据；总主管不受场区限制。</p>'+
   '<div class="form-err hidden" id="sp_err"></div></div>'+
   '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" id="sp_ok">保存</button></div></div>');
  $('sp_ok').onclick=()=>saveSupAcctForm(id||null);
  $('sp_all').onchange=()=>{const w=$('sp_farmwrap');if(w)w.classList.toggle('hidden',$('sp_all').checked);};
  setTimeout(()=>{const n=$('sp_name');if(n)n.focus();},60);
}
async function saveSupAcctForm(id){
  const a=id?supAccts.find(x=>x.id===id):null;
  if(id&&!a)return;
  const name=$('sp_name').value.trim();
  const all=$('sp_all').checked;
  const farms=all?null:[...document.querySelectorAll('.sp_farm')].filter(c=>c.checked).map(c=>c.value);
  const p1=$('sp_pwd').value.trim(),p2=$('sp_pwd2').value.trim();
  const fail=m=>{const e=$('sp_err');if(e){e.textContent=m;e.classList.remove('hidden');}};
  if(!name)return fail('请填写账号名称');
  if(supAccts.some(x=>x.name===name&&x.id!==id))return fail('已有同名账号，请换个名称');
  if(!all&&(!farms||!farms.length))return fail('请至少勾选 1 个可查看场区（或勾选"总主管"）');
  if(!a||p1||p2){
    if(!/^\d{4,6}$/.test(p1))return fail('密码需为 4-6 位数字');
    if(p1!==p2)return fail('两次输入的密码不一致');
  }
  const list=supAccts.slice();
  if(a){
    const t=list.find(x=>x.id===id);
    t.name=name;t.farms=farms;
    if(p1)t.pwd=hashPwd(p1);
    /* 若改的是当前登录中的主管账号，立即刷新本机权限缓存（管理员会话不受影响） */
    if(profile.role==='supervisor'&&profile.supId===id){profile.name=t.name;profile.supFarms=t.farms===null?null:(t.farms||[]).slice();}
  }else{
    list.push({id:'sup_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,farms,pwd:hashPwd(p1)});
  }
  await saveSupAccts(list);
  persist();closeModal();render();
  toast(a?'账号已保存，全团队立即生效':'账号已创建，全团队立即生效');
}
async function delSupAcct(id){
  const a=supAccts.find(x=>x.id===id);if(!a)return;
  const ok=await confirmDlg('删除主管账号','确定删除「'+a.name+'」吗？删除后该账号立即失效（已登录的设备会被退出主管视图），可随时重新创建。','删除');
  if(!ok)return;
  await saveSupAccts(supAccts.filter(x=>x.id!==id));
  if(profile.role==='supervisor'&&profile.supId===id){profile.role='';profile.name='';delete profile.supId;delete profile.supFarms;}
  persist();render();toast('已删除账号：'+a.name);
}
/* 异步读取云端同步情况，填入管理员面板的"同步数据总览" */
async function loadSyncOverview(){
  const box=$('sync_overview');if(!box)return;
  if(!cloudEnabled()){box.innerHTML='<div class="cloud-st off">云同步未启用：数据只保存在本机，可随时导出 CSV / JSON 备份；启用后这里显示各电工上报情况。</div>';return;}
  box.innerHTML='<div class="cloud-st">正在读取云端同步数据…</div>';
  try{
    let valid=0,tomb=0,supN=0;const byW={};let last=0;
    if(cloudSvc()==='supabase'){
      /* v1.26：总览只拉 6 个小字段（不再拉含照片的完整 data），1 个请求搞定；
         云开发 / Bmob 无 JSON 列选择语法，保持原整页拉取 */
      const c=settings.cloud;
      const base=(c.url||'').replace(/\/+$/,'');
      const h={'apikey':c.key};
      if(/^eyJ/.test(c.key))h['Authorization']='Bearer '+c.key;
      const [rowsR,supsR]=await Promise.all([
        fetchRetry(base+'/rest/v1/'+CLOUD_COLL+'?select=data->>worker,data->>_deleted,data->>_boss,data->>_admin,data->>_sups,updated_at&limit=5000',{headers:h},2),
        fetchRetry(base+'/rest/v1/'+CLOUD_COLL+'?select=data&data->>_sups=eq.true&limit=1',{headers:h},2)
      ]);
      if(!rowsR.ok)throw new Error('HTTP '+rowsR.status);
      const rows=await rowsR.json();
      (Array.isArray(rows)?rows:[]).forEach(r=>{
        if(r._sups==='true')return;
        if(r._boss==='true'||r._admin==='true')return;
        if(r._deleted==='true'){tomb++;return;}
        valid++;const w=(r.worker||'').trim()||'未署名';byW[w]=(byW[w]||0)+1;
        const t=Date.parse(r.updated_at||'')||0;if(t>last)last=t;
      });
      if(supsR.ok){const sj=await supsR.json();const acc=(Array.isArray(sj)&&sj[0]&&sj[0].data&&sj[0].data.accounts)||[];supN=acc.length;}
    }else{
      const rows=await cloudPullRows({});
      (rows||[]).forEach(r=>{
        const d=r.data||{};
        if(d._boss||d._admin)return;
        if(d._sups){supN=(d.accounts||[]).length;return;}
        if(d._deleted){tomb++;return;}
        valid++;const w=(d.worker||'').trim()||'未署名';byW[w]=(byW[w]||0)+1;
        if(r.uts>last)last=r.uts;
      });
    }
    const pend=pendingUploads().length;

/* 强制重压单张图：与 compressDataURL 的区别是去掉"已经够小就不动"的短路——
   早期上传的图（900px/q0.68 产物，单张 100-250KB）全部落在短路区，必须强制重压才能再瘦身。
   canvas/Image 不可用时原样返回（由调用方检测零变化并提示）。 */
function forceCompressImg(dataURL,maxW,quality){
  return new Promise(resolve=>{
    const done=v=>resolve(v);
    try{
      if(typeof dataURL!=='string'||!/^data:image\//i.test(dataURL))return done(dataURL);
      if(typeof document==='undefined'||!document.createElement||typeof Image==='undefined')return done(dataURL);
      const img=new Image();
      img.onload=()=>{
        try{
          const w=img.naturalWidth||img.width||0,hh=img.naturalHeight||img.height||0;
          if(!w||!hh)return done(dataURL);
          const scale=Math.min(1,maxW/w);
          const cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(w*scale));cv.height=Math.max(1,Math.round(hh*scale));
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          done(cv.toDataURL('image/jpeg',quality));
        }catch(e){done(dataURL);}
      };
      img.onerror=()=>done(dataURL);
      img.src=dataURL;
    }catch(e){done(dataURL);}
  });
}
/* 在 sops 结构内原地压缩全部步骤图（不新建结构，供多轮降级复用） */
async function compressImgsIn(list,maxW,quality){
  let imgs=0,changed=0,saved=0;
  for(const g of (list||[])){
    for(const it of (g.items||[])){
      for(const s of (it.steps||[])){
        if(!s.img)continue;
        imgs++;
        const small=await forceCompressImg(s.img,maxW,quality);
        if(small&&small!==s.img&&small.length<s.img.length){saved+=s.img.length-small.length;changed++;s.img=small;}
      }
    }
  }
  return {imgs:imgs,changed:changed,saved:saved};
}
/* 一键压缩全部规范图片：分级强制重压。
   第一轮 900px/q0.68（温和）；若整体仍超上限，自动第二轮 720px/q0.52（明显瘦身，画质略降）；
   两轮后仍超限则警告并建议先去「🧹 体积明细」删图。 */
async function compressAllSopImgs(){
  const cap=Math.round(SOPS_MAX_CHARS/1024);
  const before=sopsSizeKb();
  if(!sopsBigItems(sops).some(x=>x.imgs)){toast('当前没有任何步骤图，无需压缩','ok');return;}
  const next=(sops||[]).map(g=>JSON.parse(JSON.stringify(g)));
  const r1=await compressImgsIn(next,900,0.68);
  let rounds=1,r2={imgs:0,changed:0,saved:0};
  if(sopsJsonKb(next)>cap){r2=await compressImgsIn(next,720,0.52);rounds=2;}
  const changed=r1.changed+r2.changed;
  const saved=r1.saved+r2.saved;
  if(!changed){
    toast('图片压缩失败：当前浏览器不支持图片处理（canvas 不可用）。请换一台设备打开管理后台压缩，或直接到「🧹 体积明细」删除大图','err');
    return;
  }
  const after=sopsJsonKb(next);
  const over=after>cap;
  const ok=await confirmDlg(over?'⚠️ 压缩后仍超出上限':'压缩完成',
    '共 '+r1.imgs+' 张步骤图'+(rounds>1?'，已执行 '+rounds+' 轮压缩（第二轮画质略降）':'')+'：整体从约 '+before+' KB 降到约 '+after+' KB（节省约 '+Math.round(saved/1024)+' KB）。'+
    (over?'<br>但仍超过 '+cap+' KB 上限，保存后编辑条目还是会被拦——建议先取消，去「🧹 体积明细」删除用不到的大图，再来压缩。':'')+
    '保存后全团队约 1 分钟自动更新。',
    over?'仍要保存':'保存并同步');
  if(!ok)return;
  await saveSops(next);
  toast('已压缩保存：约 '+after+' KB'+(over?'（仍超上限，请继续清理大图）':''),'ok');
  render();
}
/* 导入内置规范包：把 SOP_BUILTIN 的条目按 id 合并进同名分组（同 id 覆盖、新 id 追加），不影响其他分组 */
async function importSopBuiltin(){
  const builtin=SOP_BUILTIN;
  const cnt=builtin.reduce((n,g)=>n+(g.items||[]).length,0);
  const ok=await confirmDlg('导入内置规范包？',
    '将把内置的 '+cnt+' 条规范（孵化厂：孵化器/出雏器清洗与分级保养、地源热泵、环控系统）合并到「孵化厂」分组：同编号条目覆盖更新，新条目追加；其他分组和已有内容不受影响。保存后全团队约 1 分钟自动更新。',
    '确认导入');
  if(!ok)return;
  const next=sops.map(g=>JSON.parse(JSON.stringify(g)));
  builtin.forEach(bg=>{
    let g=next.find(x=>x.name===bg.name);
    if(!g){g={id:bg.id,name:bg.name,items:[]};next.push(g);}
    (bg.items||[]).forEach(it=>{
      const i=g.items.findIndex(x=>x.id===it.id);
      if(i>=0)g.items[i]=JSON.parse(JSON.stringify(it));
      else g.items.push(JSON.parse(JSON.stringify(it)));
    });
  });
  /* v1.28.1：合并后体积预检。内置包本身不大；若合并后超限，说明本机历史内容（多为早期上传的大图）需先清理，
     否则之后编辑任何条目都会被 2.5MB 上限挡住、云端上传也可能失败。警告但允许用户知情后继续。 */
  const mergedKb=sopsJsonKb(next);
  if(mergedKb>Math.round(SOPS_MAX_CHARS/1024)){
    const ok2=await confirmDlg('⚠️ 合并后将超出体积上限',
      '导入后规范内容约 '+mergedKb+' KB，超过 '+Math.round(SOPS_MAX_CHARS/1024)+' KB 上限：之后编辑任何条目都无法保存，云端也可能上传失败。建议先取消，在管理后台点「🧹 体积明细」清理占空间最大的旧条目（通常是早期上传未压缩的大图）后再导入。仍要继续导入吗？',
      '仍要导入');
    if(!ok2)return;
  }
  await saveSops(next);
  toast('已导入 '+cnt+' 条规范并保存到云端'+(mergedKb>Math.round(SOPS_MAX_CHARS/1024)?'（注意：内容已超体积上限，请先清理大图再编辑条目）':''),'ok');
  render();
}

function sopSetType(t){
  if(!sopDraft||sopDraft.type===t)return;
  readSopDraftSteps();
  sopDraft.type=t;
  if(t==='sop'&&(!sopDraft.steps||!sopDraft.steps.length))sopDraft.steps=[{t:''}];
  renderSopItemDlg();
}
function sopAddStep(){readSopDraftSteps();sopDraft.steps.push({t:''});renderSopItemDlg();}
function sopDelStep(i){readSopDraftSteps();sopDraft.steps.splice(i,1);renderSopItemDlg();}
function sopMoveStep(i,d){readSopDraftSteps();const a=sopDraft.steps;const j=i+d;if(j<0||j>=a.length)return;const t=a[i];a[i]=a[j];a[j]=t;renderSopItemDlg();}
function sopDelImg(i){readSopDraftSteps();sopDraft.steps[i].img='';renderSopItemDlg();}
async function sopPickImg(i,input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast('请选择图片文件','err');return;}
  try{
    const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
    const small=await compressDataURL(raw,900,0.68);
    readSopDraftSteps();
    sopDraft.steps[i].img=small;
    renderSopItemDlg();
    toast('图片已压缩嵌入（约 '+Math.round((small||'').length/1024)+' KB）');
  }catch(e){toast('图片读取失败：'+e.message,'err');}
}
async function saveSopItemForm(){
  if(!sopDraft)return;
  readSopDraftSteps();
  const d=sopDraft;
  const fail=m=>{const e=$('sd_err');if(e){e.textContent=m;e.classList.remove('hidden');}};
  const title=($('sd_title').value||'').trim();
  if(!title)return fail('请填写标题');
  const item={id:d.id,type:d.type,title:title};
  if(d.type==='faq'){
    item.cause=($('sd_cause').value||'').trim();
    item.fix=($('sd_fix').value||'').trim();
    if(!item.cause&&!item.fix)return fail('请至少填写"可能原因"或"处理办法"');
  }else{
    item.meta=($('sd_meta').value||'').trim();
    item.steps=(d.steps||[]).filter(s2=>(s2.t||'').trim()||s2.img).map(s2=>({t:(s2.t||'').trim(),img:s2.img||''}));
    if(!item.steps.length)return fail('请至少填写一个步骤');
  }
  const list=JSON.parse(JSON.stringify(sops));
  const g=list.find(x=>x.id===d.gid);if(!g)return fail('所属分组不存在，请关闭后重试');
  if(!g.items)g.items=[];
  const idx=g.items.findIndex(x=>x.id===d.id);
  if(idx>=0)g.items[idx]=item;else g.items.push(item);
  if(JSON.stringify(list).length>SOPS_MAX_CHARS){
    const kb=sopsJsonKb(list),cap=Math.round(SOPS_MAX_CHARS/1024);
    const top=sopsBigItems(list,5);
    const e=$('sd_err');
    if(e){
      e.innerHTML='<b>内容总体积超限：当前约 '+kb+' KB，上限 '+cap+' KB（超出约 '+(kb-cap)+' KB）。</b><br>占用最大的条目：<br>'+
        top.map(x=>(x.type==='faq'?'⚠️ ':'📋 ')+'「'+esc(x.title)+'」（'+esc(x.gname)+'）约 '+x.kb+' KB'+(x.imgs?'，含 '+x.imgs+' 张步骤图':'')).join('<br>')+
        '<br>请先到管理后台「🧹 体积明细」删除或更换这些条目里的大图，再保存。';
      e.classList.remove('hidden');
    }
    return;
  }
  await saveSops(list);closeModal();render();toast('已保存，全团队约 1 分钟内自动更新');
}
async function delSopItem(gid,iid){
  const g=(sops||[]).find(x=>x.id===gid);if(!g)return;
  const it=(g.items||[]).find(x=>x.id===iid);if(!it)return;
  const ok=await confirmDlg('删除条目','确定删除「'+it.title+'」吗？删除后全团队立即生效。','删除');
  if(!ok)return;
  const list=JSON.parse(JSON.stringify(sops));
  const gg=list.find(x=>x.id===gid);
  if(gg)gg.items=(gg.items||[]).filter(x=>x.id!==iid);
  await saveSops(list);render();toast('已删除条目：'+it.title);
}

   widths.map(w=>'<Column ss:Width="'+w+'"/>').join('')+

/* ---- 真 .xlsx 导出：zip 容器 + 维修照片内嵌到行（Excel / WPS 直接打开，无外部依赖） ---- */
function utf8Bytes(s){ /* 字符串 → UTF-8 字节（含代理对/中文），不依赖 TextEncoder */
  s=String(s==null?'':s);
  const out=[];
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    if(c<0x80)out.push(c);
    else if(c<0x800)out.push(0xC0|(c>>6),0x80|(c&0x3F));
    else if(c>=0xD800&&c<=0xDBFF&&i+1<s.length){
      const c2=s.charCodeAt(i+1);
      const cp=((c-0xD800)<<10)+(c2-0xDC00)+0x10000;
      out.push(0xF0|(cp>>18),0x80|((cp>>12)&0x3F),0x80|((cp>>6)&0x3F),0x80|(cp&0x3F));
      i++;
    }
    else out.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F));
  }
  return new Uint8Array(out);
}
function b64ToBytes(b64){ /* Base64 → 字节（手写解码，不依赖 atob，跨环境一致） */
  const T='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const s=String(b64==null?'':b64).replace(/[^A-Za-z0-9+/=]/g,'');
  const out=[];let n=0,bits=0;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==='=')break;
    const v=T.indexOf(c);
    if(v<0)continue;
    n=(n<<6)|v;bits+=6;
    if(bits>=8){bits-=8;out.push((n>>bits)&0xFF);}
  }
  return new Uint8Array(out);
}
function parseDataURL(u){const m=/^data:([^;,]+)(;base64)?,(.*)$/s.exec(String(u||''));if(!m)return null;return{mime:m[1],b64:m[3]};}
function imgSize(b){ /* 解析 JPEG(SOF) / PNG(IHDR) 宽高，失败返回 null */
  if(!b||b.length<24)return null;
  if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47){ /* PNG */
    return{w:(b[16]<<24|b[17]<<16|b[18]<<8|b[19])>>>0,h:(b[20]<<24|b[21]<<16|b[22]<<8|b[23])>>>0};
  }
  if(b[0]===0xFF&&b[1]===0xD8){ /* JPEG：逐段扫到 SOFn */
    let i=2;const n=b.length;
    while(i<n-3){
      if(b[i]!==0xFF){i++;continue;}
      const m=b[i+1];
      if(m===0xFF){i++;continue;}
      if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){i+=2;continue;}
      if(m===0xD9)break;
      const l=(b[i+2]<<8)|b[i+3];
      if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return{w:(b[i+7]<<8)|b[i+8],h:(b[i+5]<<8)|b[i+6]};
      if(l<2)break;
      i+=2+l;
    }
  }
  return null;
}
const CRC32_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=(0^-1)>>>0;for(let i=0;i<b.length;i++)c=(CRC32_T[(c^b[i])&0xFF]^(c>>>8))>>>0;return (c^-1)>>>0;}
function zipStore(files){ /* files:[{name:string,data:Uint8Array}] → Uint8Array（store 不压缩，JPEG 本身已压缩） */
  const enc={encode:utf8Bytes};
  const recs=files.map(f=>({name:enc.encode(f.name),data:f.data,crc:crc32(f.data)}));
  let total=22;
  recs.forEach(r=>{total+=30+r.name.length+r.data.length+46+r.name.length;});
  const out=new Uint8Array(total);
  let p=0;
  const u16=v=>{out[p++]=v&255;out[p++]=(v>>>8)&255;};
  const u32=v=>{out[p++]=v&255;out[p++]=(v>>>8)&255;out[p++]=(v>>>16)&255;out[p++]=(v>>>24)&255;};
  const w=a=>{out.set(a,p);p+=a.length;};
  const offsets=[];
  recs.forEach(r=>{
    offsets.push(p);
    u32(0x04034b50);u16(20);u16(0);u16(0);u16(0);u16(0x21); /* 方法 0=store；时间/日期固定 1980-01-01 */
    u32(r.crc);u32(r.data.length);u32(r.data.length);u16(r.name.length);u16(0);
    w(r.name);w(r.data);
  });
  const cdStart=p;
  recs.forEach((r,idx)=>{
    u32(0x02014b50);u16(20);u16(20);u16(0);u16(0);u16(0);u16(0x21);
    u32(r.crc);u32(r.data.length);u32(r.data.length);u16(r.name.length);
    u16(0);u16(0);u16(0);u16(0);u32(0);u32(offsets[idx]);
    w(r.name);
  });
  u32(0x06054b50);u16(0);u16(0);u16(recs.length);u16(recs.length);
  u32(p-cdStart);u32(cdStart);u16(0);
  return out;
}

function exportStatsXLSX(){
  const all=allEnriched().slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!all.length){toast('暂无数据可导出','err');return;}
  const costCols=canCost();   /* 费用列仅主管/管理员导出时附加，电工端导出与旧版一致 */
  /* 1. 照片收集：dataURL → 字节 + 尺寸，锚点按记录顺序编号 */
  const media=[],anchors=[];
  const EMU=9525,IMG_W=240;
  all.forEach((r,ri)=>{
    (r.images||[]).forEach(src=>{
      const p=parseDataURL(src);
      if(!p||p.mime.indexOf('image/')!==0||!p.b64)return;
      let bytes=null;
      try{bytes=b64ToBytes(p.b64);}catch(e){}
      if(!bytes||!bytes.length)return;
      const sz=imgSize(bytes)||{w:4,h:3};
      media.push({ext:/png/i.test(p.mime)?'png':'jpeg',bytes:bytes});
      const cx=IMG_W*EMU;
      const cy=Math.max(EMU,Math.round(IMG_W*(sz.h||3)/(sz.w||4)*EMU));
      anchors.push({row:ri+1,col:costCols?21:14,cx:cx,cy:cy,rid:'rId'+media.length});
    });
  });
  /* 2. 有照片的行按片数叠加行高（pt） */
  const rowHts={};
  anchors.forEach(a=>{rowHts[a.row]=(rowHts[a.row]||0)+a.cy;});
  Object.keys(rowHts).forEach(k=>{rowHts[k]=Math.max(18,Math.round(rowHts[k]/EMU*0.75)+4);});
  /* 3. Sheet1 维修记录（基础 14 列 + 费用 6 列[仅主管/管理员] + 照片列） */
  const baseHdr1=['场区/位置','设备名称','配件名称','上次维修日期','本次维修日期','使用寿命(月)','下次预计到期','距今天数','状态','维修内容','维修电工','照片数','备注','录入时间'];
  const costHdr1=['配件费(元)','人工费(元)','合计(元)','谁修的','外协单位','归因标签','维修类别'];
  const costVals1=r=>[hasCost(r)?recCost(r).parts:'',hasCost(r)?recCost(r).labor:'',hasCost(r)?recCost(r).total:'',hasCost(r)?(r.outsource?'外协':'自修'):'',hasCost(r)?(r.outVendor||''):'',r.cause||'',prodRelTxt(r)];
  const HDR1=baseHdr1.concat(costCols?costHdr1:[]).concat(['维修照片']);
  const rows1=[HDR1];
  all.forEach(r=>rows1.push([r.farm,r.device,r.part,r.lastDate||'',r.date,r.lifespanMonths,r.nextDue?fmt(r.nextDue):'',r.daysLeft==null?'':r.daysLeft,STATUS_TXT[r.status],r.content||'',r.worker||'',(r.images||[]).length,r.note||'',(r.createdAt||'').slice(0,10)].concat(costCols?costVals1(r):[]).concat([''])));
  /* 4. Sheet2 配件寿命统计 */
  const HDR2=['配件名称','更换次数','平均寿命(月)','最短寿命(月)','最长寿命(月)','最近更换日期','涉及场区数','涉及设备数','各设备明细（设备 · 次数 · 均寿）'];
  const partRows=statsByPart(all);
  const rows2=[HDR2].concat(partRows.map(p=>[p.part,p.count,p.avg||'',p.min||'',p.max||'',p.last,p.farmN,p.devN,p.devTxt]));
  /* 5. Sheet3 设备维修档案 */
  const HDR3=['场区/位置','设备名称','配件名称','更换次数','平均寿命(月)','最短寿命(月)','最长寿命(月)','最近更换日期'];

  const rows3=[HDR3].concat(devRows.map(d=>[d.farm,d.device,d.part,d.count,d.avg||'',d.min||'',d.max||'',d.last]));
  /* 6. 组装 xlsx 包 */
  const hasImg=media.length>0;
  const withCostSheet=canCost();
  const files=[];
  files.push({name:'[Content_Types].xml',data:utf8Bytes(
   '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
   '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
   '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
   '<Default Extension="xml" ContentType="application/xml"/>'+
   '<Default Extension="jpeg" ContentType="image/jpeg"/>'+
   '<Default Extension="png" ContentType="image/png"/>'+
   '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
   '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
   '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
   '<Override PartName="/xl/worksheets/sheet3.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
   (withCostSheet?'<Override PartName="/xl/worksheets/sheet4.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>':'')+
   '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
   (hasImg?'<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>':'')+
   '</Types>')});
  files.push({name:'_rels/.rels',data:utf8Bytes(
   '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+xRel('rId1','officeDocument','xl/workbook.xml')+'</Relationships>')});
  files.push({name:'xl/workbook.xml',data:utf8Bytes(
   '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
   '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
   '<sheet name="维修记录" sheetId="1" r:id="rId1"/>'+
   '<sheet name="配件寿命统计" sheetId="2" r:id="rId2"/>'+
   '<sheet name="设备维修档案" sheetId="3" r:id="rId3"/>'+
   (withCostSheet?'<sheet name="费用与归因汇总" sheetId="4" r:id="rId4"/>':'')+
   '</sheets></workbook>')});
  files.push({name:'xl/_rels/workbook.xml.rels',data:utf8Bytes(
   '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
   xRel('rId1','worksheet','worksheets/sheet1.xml')+xRel('rId2','worksheet','worksheets/sheet2.xml')+xRel('rId3','worksheet','worksheets/sheet3.xml')+
   (withCostSheet?xRel('rId4','worksheet','worksheets/sheet4.xml'):'')+
   xRel(withCostSheet?'rId5':'rId4','styles','styles.xml')+
   '</Relationships>')});
  files.push({name:'xl/styles.xml',data:utf8Bytes(X_STYLES)});
  files.push({name:'xl/worksheets/sheet1.xml',data:utf8Bytes(xSheetXml(costCols?[90,110,120,100,100,90,110,80,80,160,80,60,140,100,80,80,90,70,110,90,90,42]:[90,110,120,100,100,90,110,80,80,160,80,60,140,100,42],rows1,rowHts,hasImg))});
  files.push({name:'xl/worksheets/sheet2.xml',data:utf8Bytes(xSheetXml([130,80,100,100,100,110,90,90,220],rows2,null,false))});
  files.push({name:'xl/worksheets/sheet3.xml',data:utf8Bytes(xSheetXml([90,120,130,80,100,100,100,110],rows3,null,false))});
  if(withCostSheet)files.push({name:'xl/worksheets/sheet4.xml',data:utf8Bytes(xSheetXml([220,90,90,110,90],costSummaryRows(all),null,false))});
  if(hasImg){
    files.push({name:'xl/worksheets/_rels/sheet1.xml.rels',data:utf8Bytes(
     '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+xRel('rId1','drawing','../drawings/drawing1.xml')+'</Relationships>')});

     anchors.map((a,i)=>xRel(a.rid,'image','../media/image'+(i+1)+'.'+media[i].ext)).join('')+'</Relationships>')});
    media.forEach((m,i)=>files.push({name:'xl/media/image'+(i+1)+'.'+m.ext,data:m.bytes}));

function buildSeedHTML(extraSeed,filename){

  const seed=Object.assign({records:activeRecords(),settings:{remindDays:settings.remindDays,farms:settings.farms}},extraSeed||{});
  const bs=String.fromCharCode(92),nl=String.fromCharCode(10);
  const json=JSON.stringify(seed).split('</').join('<'+bs+'/');
  const marker='/*'+'__SEED_SLOT__'+'*/';
  let src=APP_SOURCE;
  const i=src.lastIndexOf(marker);
  if(i>=0){
    const e=src.indexOf(nl,i);
    src=src.slice(0,i)+marker+'window.__EMW_SEED__='+json+';'+(e>=0?src.slice(e):'');
  }else{
    src=src.replace('loadAll();','window.__EMW_SEED__='+json+';'+nl+'loadAll();');
  }
  downloadFile(filename, src+nl+'</body>'+nl+'</html>', 'text/html');
  return Math.round(json.length/1024);
}

function importJSON(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      const inc=Array.isArray(data.records)?data.records:[];
      const del=settings.deleted||[];
      let added=0,upd=0;
      inc.forEach(d=>{
        if(!d||!d.id||!d.date||d._deleted||del.includes(d.id))return;
        const local=records.find(x=>x.id===d.id);
        if(!local){records.push(d);added++;}
        else if((d.updatedAt||'')>(local.updatedAt||'')){Object.assign(local,d);upd++;}
      });
      if(data.settings&&Array.isArray(data.settings.farms))settings.farms=[...new Set([...settings.farms,...data.settings.farms])];
      if(data.profile&&!profile.role&&data.profile.role){profile=Object.assign({role:'',name:'',pwd:''},data.profile);}
      persist();render();toast('导入完成：新增 '+added+' 条，更新 '+upd+' 条');
    }catch(e){toast('导入失败：文件格式不正确','err');}
  };
  rd.readAsText(f);input.value='';
}

  }
});
/* v1.26：定时增量拉取——开着页面时也能看到别人刚上传的内容（电工登记后，主管/其他终端约 1 分钟内可见）。
   增量只拉最近变更的行（payload 很小），45 秒内刚同步过就跳过；失败静默，只在同步状态卡提示 */
setInterval(()=>{
  if(document.hidden||!cloudEnabled())return;
  if(Date.now()-lastSyncMs()<45*1000)return;
  syncNext(async()=>{await cloudPullMerge(true,true);await pullSopsInto();});
},30*1000);
setInterval(()=>{if(!document.hidden)checkDue();},30*60*1000);
render();
a2hsHint();
checkDue();
if(!profile.role)firstRunGuide();
else if(profile.role==='worker'&&!profile.name)guideRole('worker');
if(cloudEnabled()){
  /* 延迟 2.5 秒再同步：等手机网络就绪（刚从微信切过来时 DNS/TLS 未握手完，立即请求易失败）；
     明确离线时跳过；silent 模式：后台失败只更新状态卡，不弹错误打扰电工。
     v1.26：启动只做增量拉取（首次安装本机无同步记录时 since=0 自然全量），全量刷新交给用户手动点——
     过去每次开 App 都重拉全部历史记录（含照片 base64），是“同步要等好几分钟”的主因之一 */
  setTimeout(()=>{
    if(navigator.onLine===false)return;
    /* 串入同步链：与用户手动同步/补传排队，避免交错；已在链内，直接调内部执行体防止重入死锁 */
    syncNext(async()=>{await cloudPullMerge(false,true);await retryPendingInner();await pullSopsInto();});
  },2500);
}
</script>
</body>
</html>
